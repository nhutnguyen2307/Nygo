<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo ban cuoi.png">
    <title>Quên mật khẩu - Nygo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:wght@700&family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/forgot-password.css" />
</head>
<body>
 
  <!-- ================================================
       TRANG QUÊN MẬT KHẨU — layout 2 cột
       Tái dùng nền + logo Nygo từ login/register
  ================================================= -->
  <div class="fp-page">
 
    <!-- CỘT TRÁI: logo + tagline -->
    <div class="fp-left">
      <div class="fp-logo" role="img" aria-label="Logo Nygo"></div>
      <h1 class="fp-tagline">Đừng lo,<br>chúng tôi luôn<br>ở đây giúp bạn</h1>
    </div>
 
    <!-- CỘT PHẢI: thẻ form (3 bước) -->
    <div class="fp-right">
      <div class="fp-card">
 
        <!-- ===== BƯỚC 1: Nhập email ===== -->
        <div id="step-1" class="fp-step active">
          <h2 class="fp-title">Quên mật khẩu?</h2>
          <p class="fp-subtitle">Nhập email của bạn — chúng tôi sẽ gửi mã xác nhận</p>
 
          <div class="fp-input-wrapper">
            <input
              id="fp-email"
              type="email"
              class="fp-input"
              placeholder="Nhập email đã đăng ký"
              autocomplete="email"
            />
          </div>
 
          <p id="fp-error-1" class="fp-error" style="display:none;"></p>
 
          <button id="btn-send-otp" class="fp-btn" type="button">
            <span class="btn-text">Gửi mã xác nhận</span>
            <span class="btn-loading" style="display:none;">Đang gửi...</span>
          </button>
 
          <div class="fp-back-row">
            <a href="login.html" class="fp-back-link">← Quay lại đăng nhập</a>
          </div>
        </div>
 
        <!-- ===== BƯỚC 2: Nhập OTP + mật khẩu mới ===== -->
        <div id="step-2" class="fp-step">
          <h2 class="fp-title">Đặt lại mật khẩu</h2>
          <p class="fp-subtitle">
            Mã xác nhận đã gửi đến
            <strong id="fp-email-display"></strong>
          </p>
 
          <!-- Mã OTP (6 ô) -->
          <div class="otp-row" id="otp-row">
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
          </div>
 
          <!-- Đếm ngược + gửi lại -->
          <div class="otp-resend-row">
            <span id="otp-timer" class="otp-timer">Gửi lại sau <b id="otp-countdown">120</b>s</span>
            <button id="btn-resend" class="otp-resend-btn" style="display:none;" type="button">Gửi lại mã</button>
          </div>
 
          <!-- Mật khẩu mới -->
          <div class="fp-input-wrapper">
            <input
              id="fp-new-password"
              type="password"
              class="fp-input"
              placeholder="Mật khẩu mới (tối thiểu 6 ký tự)"
              autocomplete="new-password"
            />
            <button id="toggle-fp-pw" class="fp-toggle-pw" type="button" aria-label="Hiện/ẩn mật khẩu"></button>
          </div>
 
          <!-- Xác nhận mật khẩu mới -->
          <div class="fp-input-wrapper">
            <input
              id="fp-confirm-password"
              type="password"
              class="fp-input"
              placeholder="Xác nhận mật khẩu mới"
              autocomplete="new-password"
            />
            <button id="toggle-fp-confirm" class="fp-toggle-pw" type="button" aria-label="Hiện/ẩn xác nhận"></button>
          </div>
 
          <p id="fp-error-2" class="fp-error" style="display:none;"></p>
 
          <button id="btn-reset" class="fp-btn" type="button">Đặt lại mật khẩu</button>
        </div>
 
        <!-- ===== BƯỚC 3: Thành công ===== -->
        <div id="step-3" class="fp-step">
          <div class="fp-success-icon">✓</div>
          <h2 class="fp-title">Thành công!</h2>
          <p class="fp-subtitle">Mật khẩu của bạn đã được đặt lại.<br>Hãy đăng nhập lại để tiếp tục.</p>
          <a href="login.html" class="fp-btn fp-btn-link">Đăng nhập ngay</a>
        </div>
 
      </div><!-- /.fp-card -->
    </div><!-- /.fp-right -->
 
  </div><!-- /.fp-page -->
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/emailjs-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
