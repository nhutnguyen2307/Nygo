<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/logo ban cuoi.png">
    <title>Nygo - Việc làm đã lưu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/vieclam.css" />
    <style>
        body {
            background-color: #f7f9fc;
        }
        .saved-jobs-container {
            max-width: 800px;
            margin: 40px auto;
            min-height: 60vh;
            padding: 0 20px;
        }
        .saved-jobs-header {
            margin-bottom: 24px;
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #153173;
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .empty-state h5 {
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #153173;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .btn-remove-saved {
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #64748b;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .btn-remove-saved:hover {
            background: #fee2e2;
            color: #ef4444;
            border-color: #fca5a5;
        }
    </style>
</head>
<body>
<div class="main-container">

    <div id="header-container"></div>

    <div class="saved-jobs-container">
        <h2 class="saved-jobs-header">Việc làm đã lưu</h2>
        <div id="saved-jobs-render-target">
            <!-- Danh sách việc làm sẽ được render ở đây -->
        </div>
    </div>

    <div id="footer-container"></div>

</div><!-- /.main-container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script src="js/vieclamdaluu.js"></script>
<script>
    async function loadComponent(id, file) {
        const response = await fetch(file);
        const data = await response.text();
        document.getElementById(id).innerHTML = data;
    }
    loadComponent("header-container", "header.html");
    loadComponent("footer-container", "footer.html");
</script>
</body>
</html>
