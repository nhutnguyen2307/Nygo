<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo ban cuoi.png">
    <title>Đăng ký - Nygo</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:wght@700&family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>
 
  <!-- ============================================
       TRANG ĐĂNG KÝ — layout 2 cột
       Trái: nền ảnh + logo + tagline
       Phải: form đăng ký
  ============================================= -->
  <div class="reg-page">
 
    <!-- ==========================================
         CỘT TRÁI — nền, logo, tagline
    =========================================== -->
    <div class="reg-left">
      <div class="reg-logo" role="img" aria-label="Logo Nygo"></div>
      <h1 class="reg-tagline">Chạm một lần,<br>mở ngàn cơ hội</h1>
    </div>
 
    <!-- ==========================================
         CỘT PHẢI — thẻ form
    =========================================== -->
    <div class="reg-right">
      <div class="reg-card">
 
        <!-- Tiêu đề -->
        <h2 class="reg-title">Tạo tài khoản</h2>
        <p class="reg-subtitle">Tham gia ngay</p>
 
        <!-- Họ và tên -->
        <div class="reg-input-wrapper" id="reg-wrapper-name">
          <input
            id="reg-name"
            type="text"
            class="reg-input"
            placeholder="Họ và tên"
            autocomplete="name"
          />
        </div>
 
        <!-- E-mail -->
        <div class="reg-input-wrapper" id="reg-wrapper-email">
          <input
            id="reg-email"
            type="email"
            class="reg-input"
            placeholder="E-mail"
            autocomplete="email"
          />
        </div>
 
        <!-- Mật khẩu -->
        <div class="reg-input-wrapper" id="reg-wrapper-password">
          <input
            id="reg-password"
            type="password"
            class="reg-input"
            placeholder="Mật khẩu"
            autocomplete="new-password"
          />
          <button id="toggle-reg-password" class="reg-toggle-pw" type="button" aria-label="Hiện/ẩn mật khẩu"></button>
        </div>
 
        <!-- Xác nhận mật khẩu -->
        <div class="reg-input-wrapper" id="reg-wrapper-confirm">
          <input
            id="reg-confirm"
            type="password"
            class="reg-input"
            placeholder="Xác nhận mật khẩu"
            autocomplete="new-password"
          />
          <button id="toggle-reg-confirm" class="reg-toggle-pw" type="button" aria-label="Hiện/ẩn xác nhận mật khẩu"></button>
        </div>
 
        <!-- Checkbox đồng ý điều khoản -->
        <div class="reg-terms-row">
          <input id="reg-checkbox-hidden" type="checkbox" style="display:none;" />
          <div
            id="reg-checkbox"
            class="reg-checkbox"
            role="checkbox"
            aria-checked="false"
            tabindex="0"
            aria-labelledby="reg-terms-label"
          ></div>
          <label id="reg-terms-label" class="reg-terms-label" for="reg-checkbox-hidden">
            Tôi đồng ý với
            <span class="reg-terms-link">Điều khoản dịch vụ</span>
            và
            <span class="reg-terms-link">Chính sách bảo mật</span>
            của Nygo
          </label>
        </div>
 
        <!-- Thông báo lỗi -->
        <p id="reg-error" class="reg-error" style="display:none;"></p>
 
        <!-- Nút Đăng ký -->
        <button id="btn-register" class="btn-register" type="button">
          Đăng ký
        </button>
 
        <!-- Link quay lại Đăng nhập -->
        <div class="reg-login-row">
          <span class="reg-login-text">Bạn đã có tài khoản?</span>
          <a href="login.html" class="reg-login-link">Đăng nhập</a>
        </div>
 
      </div><!-- /.reg-card -->
    </div><!-- /.reg-right -->
 
  </div><!-- /.reg-page -->
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
