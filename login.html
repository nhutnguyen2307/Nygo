<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo ban cuoi.png">
    <title>Đăng nhập - Nygo</title>
 
  <!-- Google Fonts (nhất quán với dự án Nygo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:wght@700&family=Poppins:wght@400;500;600;700&display=swap" />
 
  <!-- Bootstrap (nhất quán với dự án) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
 
  <!-- CSS riêng cho trang login -->
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
 
  <!-- ========================================
       KHUNG TOÀN TRANG - nền ảnh từ Figma
  ========================================= -->
  <div class="login-page">
 
    <!-- Logo góc trái trên -->
    <div class="login-logo" role="img" aria-label="Logo Nygo"></div>
 
    <!-- Tiêu đề chào mừng -->
    <h1 class="login-title">Chào mừng bạn tham gia !</h1>
    <p class="login-subtitle">Đăng nhập để tiếp tục hành trình tìm việc</p>
 
    <!-- ==================
         Ô nhập Email
    =================== -->
    <div class="input-wrapper" id="wrapper-email">
      <!-- Input email với icon background -->
      <input
        id="input-email"
        type="email"
        class="input-field"
        placeholder="Nhập email của bạn"
        autocomplete="email"
      />
    </div>
 
    <!-- ==================
         Ô nhập Mật khẩu
    =================== -->
    <div class="input-wrapper" id="wrapper-password">
      <input
        id="input-password"
        type="password"
        class="input-field"
        placeholder="Nhập mật khẩu"
        autocomplete="current-password"
      />
      <!-- Nút hiện/ẩn mật khẩu -->
      <button
        id="toggle-password"
        class="btn-toggle-password"
        type="button"
        aria-label="Hiện/ẩn mật khẩu"
        title="Hiện/ẩn mật khẩu"
      ></button>
    </div>
 
    <!-- ==================
         Lưu đăng nhập & Quên mật khẩu
    =================== -->
    <div class="login-options">
      <!-- Checkbox ẩn (cho accessibility) -->
      <input id="checkbox-remember" type="checkbox" style="display:none;" />
      <!-- Checkbox hiển thị tuỳ chỉnh -->
      <div
        id="custom-checkbox"
        class="custom-checkbox"
        role="checkbox"
        aria-checked="false"
        tabindex="0"
        aria-labelledby="label-remember"
      ></div>
      <label id="label-remember" class="label-remember" for="checkbox-remember">
        Lưu đăng nhập
      </label>
      <a id="link-forgot" class="link-forgot" href="forgot-password.html">Quên mật khẩu?</a>
    </div>
 
    <!-- ==================
         Nút Đăng nhập
    =================== -->
    <button id="btn-login" class="btn-login" type="button">
      Đăng nhập
    </button>
 
    <!-- ==================
         Liên kết Đăng ký
    =================== -->
    <div class="register-row">
      <span class="register-text">Bạn chưa có tài khoản?</span>
      <a id="link-register" class="register-link" href="register.html">
        Đăng ký ngay
      </span>
    </div>
 
  </div>
  
  <!-- /.login-page -->
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
